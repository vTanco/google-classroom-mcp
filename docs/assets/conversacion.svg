<svg xmlns="http://www.w3.org/2000/svg" width="960" height="812" viewBox="0 0 960 812" role="img" aria-label="Ejemplo de conversación: Claude crea 17 tareas en borrador, las copia a otros dos grupos y resume lo pendiente de la semana">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbc04"/><stop offset="1" stop-color="#f28b54"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b3d2e" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="8" y="8" width="944" height="796" rx="20" fill="#f6f8f7" stroke="#d6e2db" filter="url(#shadow)"/>
    <path d="M8 28a20 20 0 0 1 20-20h904a20 20 0 0 1 20 20v28H8z" fill="#ffffff"/>
    <line x1="8" y1="56" x2="952" y2="56" stroke="#e2ebe6"/>
    <circle cx="36" cy="32" r="6" fill="#f87171"/><circle cx="56" cy="32" r="6" fill="#fbbf24"/><circle cx="76" cy="32" r="6" fill="#34d399"/>
    <text x="480" y="38" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Claude</text>
    <rect x="740" y="20" width="192" height="24" rx="12" fill="#e7f3ec"/>
    <circle cx="756" cy="32" r="4" fill="#22a05a"/>
    <text x="768" y="37" font-size="12.5" fill="#14532d">Google Classroom conectado</text>

    <!-- 1 -->
    <rect x="388" y="80" width="540" height="96" rx="16" fill="#14532d"/>
    <g font-size="16" fill="#ffffff">
      <text x="408" y="110">Crea en 2º ESO Tecnología las prácticas 2 a 18, cada una con</text>
      <text x="408" y="134">su ficha como copia para cada alumno, 10 puntos y entrega</text>
      <text x="408" y="158">el día de su sesión. Déjalas en borrador.</text>
    </g>

    <!-- 2 -->
    <rect x="32" y="196" width="244" height="26" rx="13" fill="#e7f3ec"/>
    <text x="48" y="214" font-size="12.5" fill="#14532d">Classroom · crear tarea  ×17</text>
    <rect x="32" y="230" width="560" height="96" rx="16" fill="#ffffff" stroke="#dbe5df"/>
    <g font-size="16" fill="#1f2937">
      <text x="52" y="260">Hecho: 17 tareas en borrador en el tema Sistemas IoT.</text>
      <text x="52" y="284">La práctica 2 vence el martes 20 y la 18, el jueves 26 de</text>
      <text x="52" y="308">noviembre. Revísalas y publícalas cuando quieras.</text>
    </g>

    <!-- 3 -->
    <rect x="644" y="346" width="284" height="50" rx="16" fill="#14532d"/>
    <text x="664" y="377" font-size="16" fill="#ffffff">Cópialas también a 2º B y 2º C.</text>

    <!-- 4 -->
    <rect x="32" y="416" width="270" height="26" rx="13" fill="#e7f3ec"/>
    <text x="48" y="434" font-size="12.5" fill="#14532d">Classroom · copiar a otros grupos</text>
    <rect x="32" y="450" width="560" height="50" rx="16" fill="#ffffff" stroke="#dbe5df"/>
    <text x="52" y="481" font-size="16" fill="#1f2937">Listo: 34 copias en borrador, cada una en el tema de su grupo.</text>

    <!-- 5 -->
    <rect x="620" y="520" width="308" height="50" rx="16" fill="#14532d"/>
    <text x="640" y="551" font-size="16" fill="#ffffff">¿Qué tengo pendiente esta semana?</text>

    <!-- 6 -->
    <rect x="32" y="590" width="270" height="26" rx="13" fill="#e7f3ec"/>
    <text x="48" y="608" font-size="12.5" fill="#14532d">Classroom · resumen de pendientes</text>
    <rect x="32" y="624" width="560" height="104" rx="16" fill="#ffffff" stroke="#dbe5df"/>
    <rect x="52" y="644" width="4" height="64" rx="2" fill="url(#accent)"/>
    <g font-size="16" fill="#1f2937">
      <text x="68" y="658"><tspan font-weight="700">2º A:</tspan> 3 borradores y un anuncio el lunes a las 8:00.</text>
      <text x="68" y="682"><tspan font-weight="700">Viernes:</tspan> vence la práctica 6 en 2º A y 2º B.</text>
      <text x="68" y="706"><tspan font-weight="700">Martes:</tspan> vence el proyecto de 4º.</text>
    </g>

    <!-- input -->
    <rect x="32" y="748" width="896" height="40" rx="20" fill="#ffffff" stroke="#dbe5df"/>
    <text x="54" y="773" font-size="15" fill="#94a3b8">Escribe a Claude…</text>
    <circle cx="906" cy="768" r="14" fill="#14532d"/>
    <path d="M900 768h12M907 763l5 5-5 5" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
