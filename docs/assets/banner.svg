<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Google Classroom MCP para docentes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d2e"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1" stop-color="#1f6f43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbc04"/>
      <stop offset="1" stop-color="#f28b54"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1180" cy="-40" r="220" fill="#34a853" opacity="0.18"/>
  <circle cx="1090" cy="420" r="200" fill="#fbbc04" opacity="0.08"/>

  <!-- Chalkboard -->
  <g transform="translate(860 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="196" rx="14" fill="#c8e6c9"/>
    <rect x="12" y="12" width="276" height="172" rx="8" fill="#1e5631"/>
    <circle cx="150" cy="78" r="26" fill="#e8f5e9"/>
    <path d="M104 150c6-26 24-40 46-40s40 14 46 40" fill="#e8f5e9"/>
    <circle cx="76" cy="92" r="17" fill="#a5d6a7"/>
    <path d="M44 150c4-18 16-28 32-28s28 10 32 28" fill="#a5d6a7"/>
    <circle cx="224" cy="92" r="17" fill="#a5d6a7"/>
    <path d="M192 150c4-18 16-28 32-28s28 10 32 28" fill="#a5d6a7"/>
    <rect x="110" y="196" width="80" height="14" rx="4" fill="#c8e6c9"/>
  </g>

  <!-- Chat bubble with spark -->
  <g transform="translate(760 150)" filter="url(#shadow)">
    <path d="M0 18C0 8 8 0 18 0h120c10 0 18 8 18 18v58c0 10-8 18-18 18H52l-26 22 4-22H18C8 94 0 86 0 76z" fill="#ffffff"/>
    <g transform="translate(78 47)" fill="url(#accent)">
      <path d="M0-28 7-7 28 0 7 7 0 28-7 7-28 0-7-7z"/>
    </g>
  </g>

  <!-- Title -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#a7f3d0" font-size="22" font-weight="600" letter-spacing="3">SERVIDOR MCP · CÓDIGO ABIERTO</text>
    <text x="72" y="170" fill="#ffffff" font-size="56" font-weight="800">Google Classroom</text>
    <text x="72" y="232" fill="#ffffff" font-size="56" font-weight="800">para docentes</text>
    <rect x="72" y="250" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="300" fill="#d1fae5" font-size="24">Prepara tareas, materiales y anuncios hablando con Claude.</text>
  </g>
</svg>
