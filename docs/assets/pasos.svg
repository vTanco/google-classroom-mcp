<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="Instalación en tres pasos: crea tu llave de Google, instala la extensión y dile a Claude Conecta Classroom">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbc04"/><stop offset="1" stop-color="#f28b54"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g id="card1" transform="translate(8 8)">
      <rect width="280" height="234" rx="18" fill="#ffffff" stroke="#d6e2db"/>
      <circle cx="40" cy="44" r="20" fill="url(#accent)"/>
      <text x="40" y="51" text-anchor="middle" font-size="20" font-weight="800" fill="#0b3d2e">1</text>
      <g transform="translate(212 22)" stroke="#14532d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="14" cy="22" r="10"/><path d="M22 16l20-12M34 9l6 8M28 13l5 6"/>
      </g>
      <text x="24" y="100" font-size="20" font-weight="700" fill="#0b3d2e">Crea tu llave de Google</text>
      <rect x="24" y="114" width="150" height="26" rx="13" fill="#e7f3ec"/>
      <text x="38" y="132" font-size="13" font-weight="600" fill="#14532d">10 min · una sola vez</text>
      <g font-size="15" fill="#475569">
        <text x="24" y="172">Sigue la guía, con enlaces</text>
        <text x="24" y="194">directos a cada pantalla</text>
        <text x="24" y="216">de Google Cloud.</text>
      </g>
    </g>
    <g transform="translate(340 8)">
      <rect width="280" height="234" rx="18" fill="#ffffff" stroke="#d6e2db"/>
      <circle cx="40" cy="44" r="20" fill="url(#accent)"/>
      <text x="40" y="51" text-anchor="middle" font-size="20" font-weight="800" fill="#0b3d2e">2</text>
      <g transform="translate(214 20)" stroke="#14532d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 4v24M10 18l10 10 10-10M4 34v6h32v-6"/>
      </g>
      <text x="24" y="100" font-size="20" font-weight="700" fill="#0b3d2e">Instala la extensión</text>
      <rect x="24" y="114" width="56" height="26" rx="13" fill="#e7f3ec"/>
      <text x="38" y="132" font-size="13" font-weight="600" fill="#14532d">1 min</text>
      <g font-size="15" fill="#475569">
        <text x="24" y="172">Descarga el archivo, haz</text>
        <text x="24" y="194">doble clic y pulsa Instalar</text>
        <text x="24" y="216">en Claude Desktop.</text>
      </g>
    </g>
    <g transform="translate(672 8)">
      <rect width="280" height="234" rx="18" fill="#ffffff" stroke="#d6e2db"/>
      <circle cx="40" cy="44" r="20" fill="url(#accent)"/>
      <text x="40" y="51" text-anchor="middle" font-size="20" font-weight="800" fill="#0b3d2e">3</text>
      <g transform="translate(210 22)" stroke="#14532d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6h36v24H20l-9 8v-8H6z"/><path d="M14 18h20"/>
      </g>
      <text x="24" y="100" font-size="20" font-weight="700" fill="#0b3d2e">Dile a Claude:</text>
      <rect x="24" y="114" width="56" height="26" rx="13" fill="#e7f3ec"/>
      <text x="38" y="132" font-size="13" font-weight="600" fill="#14532d">1 min</text>
      <rect x="24" y="152" width="200" height="30" rx="15" fill="#14532d"/>
      <text x="40" y="172" font-size="15" font-weight="600" fill="#ffffff">«Conecta Classroom»</text>
      <text x="24" y="216" font-size="15" fill="#475569">Elige tu cuenta y acepta.</text>
    </g>
    <g stroke="#9cc5ad" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M298 125h32M322 117l8 8-8 8"/><path d="M630 125h32M654 117l8 8-8 8"/>
    </g>
  </g>
</svg>
