<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-label="Todo ocurre en tu ordenador: Claude y la extensión hablan directamente con Google, con tu permiso y sin servidores intermedios">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d2e"/><stop offset="1" stop-color="#1f6f43"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="8" y="8" width="560" height="214" rx="18" fill="#f6f8f7" stroke="#d6e2db" stroke-dasharray="6 6"/>
    <text x="32" y="40" font-size="13" font-weight="700" letter-spacing="2" fill="#14532d">TU ORDENADOR</text>
    <g transform="translate(32 60)">
      <rect width="150" height="78" rx="14" fill="#ffffff" stroke="#d6e2db"/>
      <text x="75" y="46" text-anchor="middle" font-size="18" font-weight="700" fill="#0b3d2e">Claude</text>
    </g>
    <path d="M190 99h40" stroke="#9cc5ad" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(238 60)">
      <rect width="190" height="78" rx="14" fill="#ffffff" stroke="#d6e2db"/>
      <text x="95" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#0b3d2e">Extensión</text>
      <text x="95" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#0b3d2e">Classroom</text>
    </g>
    <g transform="translate(450 62)">
      <rect width="96" height="74" rx="14" fill="#e7f3ec"/>
      <g stroke="#14532d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="36" y="22" width="24" height="18" rx="3"/><path d="M41 22v-5a7 7 0 0 1 14 0v5"/>
      </g>
      <text x="48" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">tu llave</text>
    </g>
    <text x="32" y="186" font-size="14.5" fill="#475569">Tu llave y tu sesión se guardan aquí, en una carpeta</text>
    <text x="32" y="206" font-size="14.5" fill="#475569">privada. Nadie más las ve.</text>

    <path d="M578 99h96M664 90l10 9-10 9" stroke="#14532d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="626" y="80" text-anchor="middle" font-size="13" fill="#14532d">con tu permiso</text>
    <text x="626" y="128" text-anchor="middle" font-size="13" fill="#14532d">sin intermediarios</text>

    <rect x="688" y="8" width="264" height="214" rx="18" fill="url(#bg)"/>
    <text x="820" y="40" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#a7f3d0">GOOGLE</text>
    <g font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="820" y="92">Classroom</text><text x="820" y="122">Drive</text><text x="820" y="152">Slides</text>
    </g>
    <text x="820" y="196" text-anchor="middle" font-size="13.5" fill="#d1fae5">Retira el acceso cuando quieras</text>
  </g>
</svg>
