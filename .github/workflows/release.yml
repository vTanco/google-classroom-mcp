name: Release
# Pushing a tag like v3.1.0 builds the Claude Desktop extension and attaches it to a
# GitHub release, so the README link .../releases/latest/download/... always works.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run build:mcpb
      - name: Publish the extension on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/google-classroom-docentes.mcpb --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/google-classroom-docentes.mcpb --title "$GITHUB_REF_NAME" --generate-notes
          fi
